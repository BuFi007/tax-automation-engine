primary_region = "gru"

[build]
  dockerfile = "apps/arca-boundary/Dockerfile"

[env]
  PORT = "4300"
  ARCA_ENVIRONMENT = "homologacion"
  ARCA_BOUNDARY_HOST = "0.0.0.0"
  ARCA_BOUNDARY_DB_PATH = "/data/arca-boundary.sqlite"
  ARCA_BOUNDARY_MASTER_KEY_FILE = "/run/secrets/arca_boundary_master_key"
  ARCA_BOUNDARY_CUIT_COMMITMENT_KEY_FILE = "/run/secrets/arca_boundary_cuit_commitment_key"
  ARCA_BOUNDARY_PAYLOAD_RETENTION_POLICY_ID = "arca-authority-terminal-recovery-v1"
  ARCA_BOUNDARY_PAYLOAD_TERMINAL_RETENTION_DAYS = "30"
  ARCA_BOUNDARY_PRODUCTION_APPROVED = "false"

[http_service]
  internal_port = 4300
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "arca_boundary_data"
  destination = "/data"

[[files]]
  guest_path = "/run/secrets/arca_boundary_master_key"
  secret_name = "ARCA_BOUNDARY_MASTER_KEY"

[[files]]
  guest_path = "/run/secrets/arca_boundary_cuit_commitment_key"
  secret_name = "ARCA_BOUNDARY_CUIT_COMMITMENT_KEY"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

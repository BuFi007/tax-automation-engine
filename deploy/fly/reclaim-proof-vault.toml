primary_region = "gru"

[build]
  dockerfile = "apps/reclaim-proof-vault/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4400"
  RECLAIM_PROOF_VAULT_DB_PATH = "/data/reclaim-proof-vault.sqlite"
  RECLAIM_PROOF_VAULT_MASTER_KEY_FILE = "/run/secrets/reclaim_proof_vault_master_key"
  RECLAIM_PROOF_VAULT_PRODUCTION_APPROVED = "false"

[http_service]
  internal_port = 4400
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "reclaim_proof_vault_data"
  destination = "/data"

[[files]]
  guest_path = "/run/secrets/reclaim_proof_vault_master_key"
  secret_name = "RECLAIM_PROOF_VAULT_MASTER_KEY"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

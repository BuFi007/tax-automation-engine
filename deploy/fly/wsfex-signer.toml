primary_region = "gru"

[build]
  dockerfile = "apps/wsfex-signer/Dockerfile"

[env]
  PORT = "4200"
  ARCA_ENVIRONMENT = "homologacion"
  WSFEX_SIGNER_HOST = "0.0.0.0"
  WSFEX_SIGNER_DB_PATH = "/data/wsfex-signer.sqlite"
  WSFEX_SIGNER_VERSION = "0.1.0"
  WSFEX_SIGNER_PRODUCTION_APPROVED = "false"
  WSFEX_SEQUENCE_RESERVATIONS_REQUIRED = "true"

[http_service]
  internal_port = 4200
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "wsfex_signer_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

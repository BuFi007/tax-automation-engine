openapi: 3.1.0
info:
  title: Motora isolated ARCA WSFEX signer boundary
  version: 1.1.0
paths:
  /health:
    get:
      summary: Return redacted homologation signer readiness without certificate material
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Safe signer readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignerHealth'
  /v1/wsfex/authorize:
    post:
      summary: Authorize one exact approved Factura E intent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignerRequest'
      responses:
        '200':
          description: Normalized ARCA result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignerResponse'
  /v1/wsfex/recover:
    post:
      summary: Recover an ambiguous result using the exact same request and payload reference
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignerRequest'
      responses:
        '200':
          description: Recovered normalized ARCA result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignerResponse'
  /v1/wsfex/reconcile:
    post:
      summary: Independently re-read the exact official document with FEXGetCMP
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignerRequest'
      responses:
        '200':
          description: Normalized result carrying a strict reconciliation attestation when accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignerResponse'
  /v1/wsfexv1/params/points-of-sale/discover:
    post:
      summary: Discover active represented-taxpayer FEEWS points from FEXGetPARAM_PtoVenta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workspaceId, issuerProfileRef]
              properties:
                workspaceId:
                  type: string
                  minLength: 1
                  maxLength: 200
                issuerProfileRef:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: Redacted authority-bound point-of-sale discovery receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointOfSaleDiscovery'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^[1-9]\d{0,14}$'
  schemas:
    PointOfSaleDiscovery:
      type: object
      additionalProperties: false
      required: [version, environment, workspaceId, issuerProfileReferenceHash, representedCuitCommitment, activePoints, authorityResponseHash, observedAt, evidenceHash]
      properties:
        version:
          const: arca-wsfex-point-of-sale-discovery-v1
        environment:
          enum: [homologation, production]
        workspaceId:
          type: string
          minLength: 1
        issuerProfileReferenceHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        representedCuitCommitment:
          type: string
          pattern: '^[a-f0-9]{64}$'
        activePoints:
          type: array
          maxItems: 1000
          items:
            type: integer
            minimum: 1
            maximum: 99998
        authorityResponseHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        observedAt:
          type: string
          format: date-time
        evidenceHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
    SignerHealth:
      type: object
      additionalProperties: false
      required: [version, environment, signerVersion, wsfexVersion, certificateDelegationConfigured, wsaaReady]
      properties:
        version:
          const: motora-wsfex-signer-health-v1
        environment:
          enum: [homologation, production]
        signerVersion:
          type: string
        wsfexVersion:
          type: string
        certificateDelegationConfigured:
          type: boolean
        wsaaReady:
          type: boolean
    Money:
      type: object
      additionalProperties: false
      required: [decimal, currency]
      properties:
        decimal:
          type: string
          pattern: '^\d+(\.\d+)?$'
        currency:
          type: string
          pattern: '^[A-Z]{3,10}$'
    AssociatedDocument:
      type: object
      additionalProperties: false
      required: [documentType, pointOfSale, invoiceNumber]
      properties:
        documentType:
          const: 19
        pointOfSale:
          type: integer
          minimum: 1
          maximum: 99998
        invoiceNumber:
          type: string
          pattern: '^[1-9]\d{0,7}$'
    InvoiceExpectedDocument:
      type: object
      additionalProperties: false
      required: [documentType, operationType, pointOfSale, issueDate, total]
      properties:
        documentType:
          const: 19
        operationType:
          const: 2
        pointOfSale:
          type: integer
          minimum: 1
          maximum: 99998
        issueDate:
          type: string
          format: date
        total:
          $ref: '#/components/schemas/Money'
    AdjustmentExpectedDocument:
      type: object
      additionalProperties: false
      required: [documentType, operationType, pointOfSale, issueDate, total, associatedDocument]
      properties:
        documentType:
          enum: [20, 21]
        operationType:
          const: 2
        pointOfSale:
          type: integer
          minimum: 1
          maximum: 99998
        issueDate:
          type: string
          format: date
        total:
          $ref: '#/components/schemas/Money'
        associatedDocument:
          $ref: '#/components/schemas/AssociatedDocument'
    ExpectedDocument:
      oneOf:
        - $ref: '#/components/schemas/InvoiceExpectedDocument'
        - $ref: '#/components/schemas/AdjustmentExpectedDocument'
    SignerRequest:
      type: object
      additionalProperties: false
      required: [version, environment, workspaceId, runId, requestId, subjectId, intentHash, authorityPayloadRef, authorityPayloadHash, expected]
      properties:
        version:
          const: motora-wsfex-boundary-v1
        environment:
          enum: [homologation, production]
        workspaceId:
          type: string
        runId:
          type: string
          format: uuid
        requestId:
          type: string
          pattern: '^[1-9]\d{0,14}$'
        subjectId:
          type: string
          description: Frozen invoice intent ID or adjustment ID.
        intentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        authorityPayloadRef:
          type: string
          description: Opaque reference resolved inside the signer/vault boundary; never a raw credential or key.
        authorityPayloadHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Canonical hash of the sealed authority payload, bound again by any reconciliation attestation.
        expected:
          $ref: '#/components/schemas/ExpectedDocument'
    AuthorizedInvoiceDocument:
      type: object
      additionalProperties: false
      required: [intentHash, documentType, operationType, pointOfSale, issueDate, total, currencyId, currencyQuote]
      properties:
        intentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        documentType:
          const: 19
        operationType:
          const: 2
        pointOfSale:
          type: integer
          minimum: 1
          maximum: 99998
        issueDate:
          type: string
          format: date
        total:
          $ref: '#/components/schemas/Money'
        currencyId:
          type: string
          minLength: 1
          maxLength: 3
          pattern: '^[A-Z0-9]{1,3}$'
          description: Exact frozen ARCA Moneda_Id submitted; ARCA-confirmed only on FEXGetCMP recovery because FEXAuthorize does not echo it.
        currencyQuote:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: Exact frozen ARCA Moneda_ctz submitted; ARCA-confirmed only on FEXGetCMP recovery because FEXAuthorize does not echo it.
    AuthorizedAdjustmentDocument:
      type: object
      additionalProperties: false
      required: [intentHash, documentType, operationType, pointOfSale, issueDate, total, currencyId, currencyQuote, associatedDocument]
      properties:
        intentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        documentType:
          enum: [20, 21]
        operationType:
          const: 2
        pointOfSale:
          type: integer
          minimum: 1
          maximum: 99998
        issueDate:
          type: string
          format: date
        total:
          $ref: '#/components/schemas/Money'
        currencyId:
          type: string
          minLength: 1
          maxLength: 3
          pattern: '^[A-Z0-9]{1,3}$'
          description: Exact frozen ARCA Moneda_Id submitted; ARCA-confirmed only on FEXGetCMP recovery because FEXAuthorize does not echo it.
        currencyQuote:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: Exact frozen ARCA Moneda_ctz submitted; ARCA-confirmed only on FEXGetCMP recovery because FEXAuthorize does not echo it.
        associatedDocument:
          $ref: '#/components/schemas/AssociatedDocument'
    AuthorizedDocument:
      oneOf:
        - $ref: '#/components/schemas/AuthorizedInvoiceDocument'
        - $ref: '#/components/schemas/AuthorizedAdjustmentDocument'
    SignerResponse:
      type: object
      additionalProperties: false
      required: [requestId, status, invoiceNumber, cae, caeExpiry, reprocessed, authorizedDocument, reconciliation, safeErrors]
      properties:
        requestId:
          type: string
          pattern: '^[1-9]\d{0,14}$'
        status:
          enum: [accepted, rejected, ambiguous, preflight_rejected]
        invoiceNumber:
          type: [string, 'null']
          pattern: '^[1-9]\d{0,7}$'
        cae:
          type: [string, 'null']
          pattern: '^\d{10,20}$'
        caeExpiry:
          type: [string, 'null']
          format: date
        reprocessed:
          type: [boolean, 'null']
        authorizedDocument:
          oneOf:
            - $ref: '#/components/schemas/AuthorizedDocument'
            - type: 'null'
        reconciliation:
          oneOf:
            - $ref: '#/components/schemas/ReconciliationAttestation'
            - type: 'null'
        safeErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
    ReconciliationAttestation:
      type: object
      additionalProperties: false
      required:
        - version
        - source
        - environment
        - representedCuitCommitment
        - authorityIdentityHash
        - authorityResponseHash
        - payloadHash
        - requestId
        - intentHash
        - documentType
        - pointOfSale
        - invoiceNumber
        - cae
        - observedAt
        - evidenceHash
      properties:
        version:
          const: arca-wsfex-reconciliation-attestation-v1
        source:
          const: FEXGetCMP
        environment:
          enum: [homologation, production]
        representedCuitCommitment:
          type: string
          pattern: '^[a-f0-9]{64}$'
        authorityIdentityHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Hash of environment, WSFEXV1 authority, represented-CUIT commitment, document type, POS, and voucher number. CAE is evidence, not identity.
        authorityResponseHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Canonical hash of the raw FEXGetCMP SOAP response; raw XML is not returned.
        payloadHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        requestId:
          type: string
          pattern: '^[1-9]\d{0,14}$'
        intentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        documentType:
          enum: [19, 20, 21]
        pointOfSale:
          type: integer
          minimum: 1
          maximum: 99998
        invoiceNumber:
          type: string
          pattern: '^[1-9]\d{0,7}$'
        cae:
          type: string
          pattern: '^\d{10,20}$'
        observedAt:
          type: string
          format: date-time
        evidenceHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
